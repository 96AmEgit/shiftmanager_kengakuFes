<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文化祭シフト表</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
      background-color: #f9f9f9;
    }
    
    /* タブのデザイン */
    .tabs {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 2px solid #ccc;
      margin-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .tab-button {
      padding: 12px 20px;
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
    }
    .tab-button.active {
      color: #0056b3;
      border-bottom: 3px solid #0056b3;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* 表とスクロールのデザイン */
    .table-container {
      max-height: 80vh;
      overflow: auto;
      background: #fff;
      border: 1px solid #ccc;
      -webkit-overflow-scrolling: touch;
    }
    table {
      border-collapse: collapse;
      min-width: max-content; /* 中身に合わせて幅を広げる */
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      text-align: center;
      font-size: 14px;
      white-space: nowrap;
    }
    
    /* ヘッダー（名前）の固定 */
    thead th {
      position: sticky;
      top: 0;
      background: #f4f4f4;
      z-index: 2;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    
    /* 左側（時間）の固定 */
    tbody th {
      position: sticky;
      left: 0;
      background: #fdfdfd;
      z-index: 1;
      font-weight: bold;
      color: #333;
      box-shadow: 1px 0 2px rgba(0,0,0,0.1);
    }

    /* 左上の角（「時間」セル）の固定 */
    thead th:nth-child(1) {
      position: sticky;
      left: 0;
      z-index: 3;
      background: #e9e9e9;
    }

    #loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>

  <div id="tabs" class="tabs"></div>
  
  <div id="tab-contents">
    <div id="loading">スプレッドシートからデータを読み込み中...</div>
  </div>

  <script>
    // ★ここにGASのURLを貼り付けてください
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxH-LxEgQdyVDtqwVAVIbJVg27__7GuOIFDzXXOkshoQ9XDAcE16R5Cgxn3T4JgKFhi/exec';
    
    async function loadData() {
      try {
        const response = await fetch(GAS_URL);
        const result = await response.json();
        
        if (result.status === "success") {
          processAndRender(result.data);
        } else {
          document.getElementById('loading').innerText = 'データ取得エラー: ' + result.message;
        }
      } catch (e) {
        document.getElementById('loading').innerText = '通信エラーが発生しました。';
      }
    }

    function processAndRender(daysData) {
      document.getElementById('loading').style.display = 'none';
      
      const tabsContainer = document.getElementById('tabs');
      const contentsContainer = document.getElementById('tab-contents');
      
      let isFirst = true;

      // daysDataは { "11月1日": [配列], "11月2日": [配列]... } のようなオブジェクト
      for (const sheetName in daysData) {
        const sheetData = daysData[sheetName];
        
        // シートにデータがない場合はスキップ
        if (!sheetData || sheetData.length === 0) continue;

        // --- タブボタンの作成 ---
        const tabBtn = document.createElement('button');
        tabBtn.className = `tab-button ${isFirst ? 'active' : ''}`;
        tabBtn.innerText = sheetName;
        tabBtn.onclick = (e) => switchTab(e, sheetName);
        tabsContainer.appendChild(tabBtn);

        // --- テーブルの作成 ---
        const contentDiv = document.createElement('div');
        contentDiv.className = `tab-content ${isFirst ? 'active' : ''}`;
        contentDiv.id = `content-${sheetName}`;

        let tableHtml = `<div class="table-container"><table>`;
        
        // ヘッダー行（名前など）を探す。最初の行ではない可能性があるため、少し探索
        // ここでは、データが入っている最初の行をヘッダーとみなす簡易的な処理
        let namesRowIndex = 0;
        for(let i=0; i<sheetData.length; i++) {
           if(sheetData[i].length > 2 && sheetData[i][2] !== "") {
               namesRowIndex = i;
               break;
           }
        }
        const namesRow = sheetData[namesRowIndex];

        tableHtml += `<thead><tr><th>時間</th>`;
        for (let j = 2; j < namesRow.length; j++) {
           tableHtml += `<th>${namesRow[j] || ''}</th>`;
        }
        tableHtml += `</tr></thead><tbody>`;

        // データ行（シフト）
        for (let i = namesRowIndex + 1; i < sheetData.length; i++) {
          const row = sheetData[i];
          // A列に時間がなければスキップ（空行や余分な行）
          if (!row[0]) continue;

          tableHtml += `<tr><th>${row[0]}<br>〜${row[1] || ''}</th>`;
          for (let j = 2; j < namesRow.length; j++) {
             tableHtml += `<td>${row[j] || ''}</td>`;
          }
          tableHtml += `</tr>`;
        }

        tableHtml += `</tbody></table></div>`;
        contentDiv.innerHTML = tableHtml;
        contentsContainer.appendChild(contentDiv);

        isFirst = false;
      }
    }

    function switchTab(event, targetSheet) {
      // すべてのタブの非アクティブ化
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      // 選択されたタブのアクティブ化
      event.target.classList.add('active');
      document.getElementById(`content-${targetSheet}`).classList.add('active');
    }

    // データ読み込み開始
    loadData();
  </script>

</body>
</html>
